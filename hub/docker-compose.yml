services:
  caretaker-hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    container_name: caretaker-hub
    restart: unless-stopped
    # Host networking so Wake-on-LAN UDP broadcast reaches the LAN.
    # On Docker Desktop / non-Linux, use ports + a correct broadcastAddress instead.
    network_mode: host
    environment:
      CARETAKER_DATA: /data
      CARETAKER_PORT: "8080"
      # First-run password. If unset it is "changeme" and the UI forces a change.
      CARETAKER_UI_PASSWORD: ${CARETAKER_UI_PASSWORD:-}
      # Optional: `openssl rand -hex 32`. If unset, a random secret is generated
      # and stored in data/config.json. Never use a value copied from docs.
      CARETAKER_SESSION_SECRET: ${CARETAKER_SESSION_SECRET:-}
    volumes:
      - ../data:/data
