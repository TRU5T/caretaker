name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hub:
    name: Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  agent:
    name: Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: agent/go.sum
      - name: Vet and build (linux)
        run: |
          go vet ./...
          go build -o caretaker-agent ./cmd/caretaker-agent
      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
          GOOS=windows GOARCH=amd64 "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Embed Windows icon
        run: |
          if [ -f winres/icon.png ]; then
            go install github.com/tc-hib/go-winres@v0.3.3
            (cd cmd/caretaker-agent && "$(go env GOPATH)/bin/go-winres" make --in ../../winres/winres.json --arch amd64 --out rsrc)
          fi
      - name: Cross-compile Windows amd64
        run: |
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -buildid=" -o caretaker-agent-setup.exe ./cmd/caretaker-agent
          sha256sum caretaker-agent-setup.exe | tee caretaker-agent-setup.exe.sha256
