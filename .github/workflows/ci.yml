name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hub:
    name: Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  agent:
    name: Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.sum
      - name: Vet and build (linux)
        run: |
          go vet ./...
          go build -o caretaker-agent ./cmd/caretaker-agent
      - name: Embed Windows icon
        run: |
          if [ -f winres/icon.png ]; then
            go install github.com/tc-hib/go-winres@v0.3.3
            (cd cmd/caretaker-agent && "$(go env GOPATH)/bin/go-winres" make --in ../../winres/winres.json --arch amd64 --out rsrc)
          fi
      - name: Cross-compile Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o caretaker-agent-setup.exe ./cmd/caretaker-agent
