name: Publish Hub image

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "agent/**"
      - "unraid/**"
      - ".github/workflows/publish-hub.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: caretaker-hub
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tags
        id: meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest,${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Caretaker Hub
            org.opencontainers.image.description=Moonlight/Apollo companion — wake, unlock, sleep
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          # User-owned package (TRU5T is a user account)
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${{ env.IMAGE_NAME }}/visibility" \
            -f visibility=public || true
          # Org-owned package fallback
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${OWNER_LC}/packages/container/${{ env.IMAGE_NAME }}/visibility" \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
