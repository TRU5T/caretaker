name: Publish Hub image

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "agent/**"
      - "unraid/**"
      - ".github/workflows/publish-hub.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless signing (cosign) and build attestations
  id-token: write
  attestations: write

env:
  IMAGE_NAME: caretaker-hub
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Image tags
        id: meta
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${OWNER_LC}/${{ env.IMAGE_NAME }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest,${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: hub/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Caretaker Hub
            org.opencontainers.image.description=Moonlight/Apollo companion — wake, unlock, sleep
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + SLSA provenance attached to the image
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Extract Windows installer and checksum
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          id="$(docker create "${IMAGE}@${DIGEST}")"
          docker cp "$id:/app/downloads/caretaker-agent-setup.exe" .
          docker cp "$id:/app/downloads/caretaker-agent-setup.exe.sha256" .
          docker rm "$id"
          sha256sum -c caretaker-agent-setup.exe.sha256
          cat caretaker-agent-setup.exe.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Sign installer (keyless, Sigstore)
        run: cosign sign-blob --yes --bundle caretaker-agent-setup.exe.sigstore.json caretaker-agent-setup.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caretaker-agent-setup
          path: |
            caretaker-agent-setup.exe
            caretaker-agent-setup.exe.sha256
            caretaker-agent-setup.exe.sigstore.json

      - name: Make package public
        continue-on-error: true
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          # User-owned package (TRU5T is a user account)
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${{ env.IMAGE_NAME }}/visibility" \
            -f visibility=public || true
          # Org-owned package fallback
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${OWNER_LC}/packages/container/${{ env.IMAGE_NAME }}/visibility" \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
